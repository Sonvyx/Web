<!-- Registration Section -->
<section class="registration">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="d-flex flex-column flex-lg-row gap-4 align-items-start">
          <!-- Prikaz selektovanog paketa -->
          <div *ngIf="selectedPackage as pkg; else noPackage" class="registration-item mb-4 flex-fill" style="min-width:260px;max-width:350px;">
            <h3>{{ pkg.name }}</h3>
            <h4><sup>€</sup>{{ pkg.price }}<span> / Mjesečno</span></h4>
            <ul>
              <li *ngFor="let feature of pkg.features">
                <i class="bi bi-check"></i><span>{{ feature }}</span>
              </li>
            </ul>
          </div>
          <ng-template #noPackage>
            <div class="alert alert-warning flex-fill" style="min-width:260px;max-width:350px;">
              Niste izabrali paket. Vratite se na cjenovnik i izaberite paket.
            </div>
          </ng-template>

          <!-- PayPal Button -->
          <div class="registration-box flex-fill" style="min-width:260px;max-width:450px;">
            <h2 class="section-title-main text-center">Registracija</h2>
            <div class="section-title-sub text-center mb-5">Pridružite se našoj zajednici i započnite zarađivati</div>
            <div id="paypal-button-container" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
